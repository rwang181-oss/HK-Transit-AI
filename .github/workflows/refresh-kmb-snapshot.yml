name: Refresh bundled KMB topology

on:
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
  push:
    branches:
      - fix/journey-local-first-kmb
    paths:
      - scripts/fetch-kmb-data.cjs
      - .github/workflows/refresh-kmb-snapshot.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download KMB topology snapshot
        run: node scripts/fetch-kmb-data.cjs

      - name: Validate snapshot
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('src/data/kmb.json', 'utf8'));
          if (!Array.isArray(data.stops) || data.stops.length < 1000) process.exit(1);
          if (!Array.isArray(data.routeStops) || data.routeStops.length < 10000) process.exit(1);
          console.log(`Validated ${data.stops.length} stops and ${data.routeStops.length} links.`);
          NODE

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- src/data/kmb.json; then
            echo 'Snapshot is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/kmb.json
          git commit -m 'data: refresh bundled KMB topology [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

name: Verify HK Transit AI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete verification
        run: npm run verify

      - name: Build production web app
        run: npm run build:web

      - name: Verify automatic refresh metadata
        run: |
          node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('dist/version.json','utf8')); if(!v.buildId) process.exit(1); const html=fs.readFileSync('dist/index.html','utf8'); if(!html.includes('name=\"hk-transit-build\"')) process.exit(1);"

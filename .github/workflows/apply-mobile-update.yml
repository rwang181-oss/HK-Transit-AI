name: Apply mobile performance update
# Fix Expo web bundler configuration and publish the verified update.

on:
  push:
    branches: [mobile-performance-fix-20260806]
    paths:
      - '.github/workflows/apply-mobile-update.yml'
  workflow_dispatch:

concurrency:
  group: mobile-performance-update
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v5
        with:
          ref: mobile-performance-fix-20260806
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify and apply bundled patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .update -maxdepth 1 -name 'patch-*.b64' | wc -l)" -eq 12
          cat .update/patch-*.b64 > /tmp/mobile-update.patch.xz.b64
          echo 'd71086610eecdb887ae024080fdaa42f604c8f6037a18ffa7ec8144598ce8b8e  /tmp/mobile-update.patch.xz.b64' | sha256sum -c -
          base64 --decode /tmp/mobile-update.patch.xz.b64 | xz --decompress > /tmp/mobile-update.patch
          echo 'effe117f9717f819a991c8b894edea1894c106149846cd21e1ed45f0127e31be  /tmp/mobile-update.patch' | sha256sum -c -
          git apply --check /tmp/mobile-update.patch
          git apply --index /tmp/mobile-update.patch
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_path = Path('scripts/verify-source.cjs')
          source = source_path.read_text()
          old = """let failures = 0;
          let typescript;
          try {
            const globalRoot = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
            typescript = require(path.join(globalRoot, 'typescript'));
          } catch (error) {
            console.error('Unable to load the globally installed TypeScript parser:', error.message);
            process.exit(1);
          }
          """
          new = """let failures = 0;
          let typescript;
          try {
            typescript = require('typescript');
          } catch (localError) {
            try {
              const globalRoot = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
              typescript = require(path.join(globalRoot, 'typescript'));
            } catch (globalError) {
              console.error(
                'Unable to load the TypeScript parser from local or global dependencies:',
                globalError.message
              );
              process.exit(1);
            }
          }
          """
          if old not in source:
              raise SystemExit('Expected TypeScript loader block was not found')
          source_path.write_text(source.replace(old, new))

          app_path = Path('app.json')
          app = json.loads(app_path.read_text())
          app.setdefault('expo', {}).setdefault('web', {})['bundler'] = 'metro'
          app_path.write_text(json.dumps(app, ensure_ascii=False, indent=2) + '\n')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['scripts']['build:web'] = 'expo export --platform web && node scripts/post-build.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')
          PY
          rm -rf .update .github/workflows/apply-mobile-update.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete verification
        run: npm run verify

      - name: Build production web app
        run: npm run build:web

      - name: Publish verified source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: optimize mobile journey performance and navigation'
          git push origin HEAD:main

      - name: Trigger production deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" -f ref=main
